# ─── Fly.io — Web app ───
# Worker üçün ayrıca app yaradın: cd worker && fly launch
# Persistent volume: fly volumes create wpm_data --size 1
app = "wp-messenger-og"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  ADMIN_USERNAME = "admin"
  DATA_DIR = "/data"
  DATABASE_URL = "/data/app.db"
  WORKER_API_URL = "https://wp-messenger-og-worker.fly.dev"
  WORKER_WS_URL = "wss://wp-messenger-og-worker.fly.dev"

[[mounts]]
  source = "wpm_data"
  destination = "/data"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true
    auto_ports = true

  [[services.http_checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
