# ─── Fly.io — Web app ───
# Worker üçün ayrıca app yaradın: cd worker && fly launch
# Heç bir volume tələb olunmur — məlumatlar Firebase RTDB-dədir.
app = "wp-messenger-og"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  ADMIN_USERNAME = "gasham"
  FIREBASE_DATABASE_URL = "https://whatsbotog-default-rtdb.firebaseio.com"
  WORKER_API_URL = "https://wp-messenger-og-worker.fly.dev"
  WORKER_WS_URL = "wss://wp-messenger-og-worker.fly.dev"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true
    auto_ports = true

  [[services.http_checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
