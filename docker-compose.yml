# ─── WpMessenger OG — Local / VPS deploy (web + worker) ───
#   cp .env.example .env   →   doldurun (WORKER_API_TOKEN)
#   docker compose up -d --build
# Panel: http://localhost:3000
#
# WhatsApp auth sessions ./data/sessions/ qovluğunda saxlanılır (persistent).
# Bütün digər məlumatlar Firebase Realtime Database-də saxlanılır.
services:
  web:
    build: .
    container_name: wp-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-gasham}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-gasham1006}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://whatsbotog-default-rtdb.firebaseio.com}
      - WORKER_API_URL=${WORKER_API_URL:-http://worker:3100}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:?WORKER_API_TOKEN required}
      - WORKER_WS_URL=${WORKER_WS_URL:-ws://worker:3100}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      - worker

  worker:
    build: ./worker
    container_name: wp-worker
    restart: unless-stopped
    volumes:
      - ./data/sessions:/app/sessions
    environment:
      - PORT=3100
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://whatsbotog-default-rtdb.firebaseio.com}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:?WORKER_API_TOKEN required}
