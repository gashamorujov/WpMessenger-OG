version: '3.8'

services:
  wp-messenger-og:
    build: .
    container_name: wp-messenger-og
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DATA_DIR=/app/data
      - SESSION_PATH=/app/sessions
      - DATABASE_URL=/app/data/app.db
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
