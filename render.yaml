# ─── Render Blueprint — web + worker ───
# https://render.com/docs/blueprint-spec
# İki ayrı service: web (Next.js) + worker (persistent WhatsApp backend).
# Heç bir disk / persistent storage tələb olunmur — Firebase RTDB kifayətdir.
services:
  - type: web
    name: wp-messenger-og-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: ADMIN_USERNAME
        value: gasham
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://whatsbotog-default-rtdb.firebaseio.com
      # Worker-in public URL-i: web paneldən /api/health-a baxıb worker ünvanını yazın
      - key: WORKER_API_URL
        value: https://wp-messenger-og-worker.onrender.com
      - key: WORKER_WS_URL
        value: wss://wp-messenger-og-worker.onrender.com
      - key: WORKER_API_TOKEN
        sync: false

  - type: web
    name: wp-messenger-og-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3100
      - key: FIREBASE_DATABASE_URL
        value: https://whatsbotog-default-rtdb.firebaseio.com
      - key: WORKER_API_TOKEN
        sync: false
